<html>
  <head>
    <title>Answer me 😍</title>
    <script
      src="https://code.jquery.com/jquery-3.4.1.js"
      integrity="sha256-WpOohJOqMqqyKL9FccASB9O0KwACQJpFTUBLTYOVvVU="
      crossorigin="anonymous"
    ></script>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.1.2/dist/confetti.browser.min.js"></script>

    <style>
                  body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        background: #FFC568;
        height: 100vh;
        width: 100%;
        font-family: sans-serif;
      }

      .container {
        width: 100%;
        height: 100%;
        background: #FFC568;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .container .wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .container .wrapper h1 {
        color: #763C8C;
        font-size: 2rem;
        font-weight: bolder;
      }
      .container .wrapper button {
        border: 1px solid #FFFFFF;
        background: #fa4843;
        color: #fff;
        padding: 10px 20px;
        border-radius: 4px;
        font-size: 1.3rem;
        cursor: pointer;
      }
      .container .wrapper button .no {
        position: absolute;
      }
    </style>
  </head>
  <body>
    <div class="sakura-falling"></div>
    <div class="container">
      <div class="wrapper">
        <h1>You Love me ? 🥺</h1>
        <div class="button">
          <button class="btn yes">Yes 😘</button>
          <button class="btn no">No 😡</button>
        </div>
      </div>
    </div>

    <!-- <script src="https://cdn.jsdelivr.net/gh/timoschaefer/jQuery-Sakura/jquery-sakura.min.js"></script> -->
    <script>
      let no = document.querySelector(".no");
      let yes = document.querySelector(".yes");
      let wrapper = document.querySelector(".wrapper");
      no.addEventListener("click", () => {
        no.textContent = "Yes 😍"
        conffetti();
      });
      yes.addEventListener("click", () => {
        setTimeout(() => {
          conffetti();
        }, 300);
      });

      let off = (e) => {
        const vw = Math.max(
          document.documentElement.clientWidth || 0,
          window.innerWidth || 0
        );
        const vh = Math.max(
          document.documentElement.clientHeight || 0,
          window.innerHeight || 0
        );
        let y = (Math.random() * 5 + 5) * e.offsetY - vh * 0.5 - 10;
        let x = (Math.random() * 5 + 5) * e.offsetX - vw * 0.5 - 10;
        return {
          x,
          y,
        };
      };

      // window.addEventListener("mousemove",moveCursor)

      no.addEventListener("mousedown", (e) => {
        let { x, y } = off(e);
        // if(e.target.classList.contains("yes")) return
        no.style.transform = `translate(${x}px,${y}px)`;
      });

      const moveCursor = (e) => {
        const mouseY = ((e.clientY * 10) / wrapper.offsetHeigh) * 0.5;
        const mouseX = (e.clientX * 10) / wrapper.offsetWidth;
        no.style.transform = `translate(${mouseX}px, ${mouseY}px, 0)`;
      };

      const conffetti = () => {
        var end = Date.now() + 5 * 1000;
        // go Buckeyes!
        var colors = ["#000", "#ff0000", "#f3f3f3"];
        (function frame() {
          confetti({
            particleCount: 2,
            angle: 60,
            spread: 55,
            origin: {
              x: 0,
            },
            colors: colors,
          });
          confetti({
            particleCount: 3,
            angle: 120,
            spread: 55,
            origin: {
              x: 1,
            },
            colors: colors,
          });
          if (Date.now() < end) {
            requestAnimationFrame(frame);
          }
        })();
      };
    </script>
  </body>
</html>
